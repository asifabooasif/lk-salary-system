<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
:root {
--primary: #1e40af; --primary-dark: #1e3a8a; --primary-light: #3b82f6;
--secondary: #0891b2; --success: #059669; --danger: #dc2626;
--warning: #d97706; --purple: #7c3aed; --pink: #db2777; --dark: #0f172a; --light: #f8fafc;
--gray: #64748b; --border: #e2e8f0;
--shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
--shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.15);
}
html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
.loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 99999; flex-direction: column; }
.loading-overlay.show { display: flex; }
.spinner { width: 50px; height: 50px; border: 5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { margin-top: 15px; color: var(--gray); font-size: 14px; font-weight: 500; }
.login-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; z-index: 10000; overflow: hidden; }
.login-container { display: grid; grid-template-columns: 1fr 1fr; max-width: 1100px; width: 90%; background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); min-height: 650px; }
.login-illustration { background: linear-gradient(135deg, #1e40af 0%, #0891b2 100%); padding: 50px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
.illustration-text { text-align: center; z-index: 2; margin-top: 30px; }
.illustration-text h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
.illustration-text p { font-size: 16px; opacity: 0.9; }
.login-form-side { padding: 50px; display: flex; flex-direction: column; justify-content: center; background: white; }
.login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
.login-logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #1e40af, #0891b2); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
.login-logo-text h2 { font-size: 22px; font-weight: 800; color: var(--dark); }
.login-logo-text p { font-size: 12px; color: var(--gray); }
.login-welcome { margin-bottom: 30px; }
.login-welcome h3 { font-size: 28px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
.login-welcome p { color: var(--gray); font-size: 14px; }
.google-btn { width: 100%; padding: 14px; background: white; border: 2px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--dark); transition: all 0.3s; margin-bottom: 20px; }
.google-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
.divider { display: flex; align-items: center; margin: 20px 0; color: var(--gray); font-size: 13px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider span { padding: 0 15px; }
.email-form { display: flex; flex-direction: column; gap: 15px; }
.form-input { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 14px; transition: all 0.3s; background: #f8fafc; }
.form-input:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(30,64,175,0.1); }
.login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #1e40af, #0891b2); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(30,64,175,0.3); }
.login-footer { text-align: center; margin-top: 25px; font-size: 13px; color: var(--gray); }
.login-footer a { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }
.main-app { display: none; }
.main-app.show { display: block; }
body { background: #f1f5f9; color: #1e293b; display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: linear-gradient(180deg, #0f172a 0%, #020617 100%); color: white; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
.sidebar-header { padding: 25px 20px; text-align: center; background: linear-gradient(135deg, #1e40af 0%, #0891b2 100%); }
.sidebar-header h2 { font-size: 22px; color: #fff; letter-spacing: 1px; }
.sidebar-header p { font-size: 12px; color: #e0f2fe; }
.sidebar-menu { padding: 15px 0; }
.menu-label { padding: 10px 25px 5px; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.menu-item { padding: 12px 25px; cursor: pointer; display: flex; align-items: center; gap: 15px; color: #cbd5e1; transition: all 0.3s; border-left: 3px solid transparent; font-size: 14px; }
.menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
.menu-item.active { background: rgba(30,64,175,0.3); color: white; border-left-color: var(--primary-light); }
.menu-item i { width: 20px; font-size: 15px; }
.main { margin-left: 260px; flex: 1; padding: 25px; width: calc(100vw - 260px); min-width: 0; }
.topbar { background: white; padding: 16px 25px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: var(--shadow); }
.topbar h1 { font-size: 20px; color: var(--dark); }
.breadcrumb { font-size: 12px; color: var(--gray); }
.section { display: none; animation: fadeIn 0.4s; width: 100%; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
.stat-card { background: white; padding: 22px; border-radius: 12px; box-shadow: var(--shadow); transition: transform 0.3s; }
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.stat-card .icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; margin-bottom: 15px; }
.stat-card h3 { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-card .value { font-size: 24px; font-weight: bold; color: var(--dark); }
.stat-card.blue .icon { background: linear-gradient(135deg, #1e40af, #3b82f6); }
.stat-card.green .icon { background: linear-gradient(135deg, #059669, #10b981); }
.stat-card.orange .icon { background: linear-gradient(135deg, #d97706, #f59e0b); }
.stat-card.red .icon { background: linear-gradient(135deg, #dc2626, #ef4444); }
.stat-card.cyan .icon { background: linear-gradient(135deg, #0891b2, #06b6d4); }
.stat-card.purple .icon { background: linear-gradient(135deg, #7c3aed, #a855f7); }
.stat-card.pink .icon { background: linear-gradient(135deg, #db2777, #ec4899); }
.charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px; }
.chart-card { background: white; padding: 22px; border-radius: 12px; box-shadow: var(--shadow); }
.chart-card h3 { margin-bottom: 18px; color: var(--dark); font-size: 16px; }
.card { background: white; padding: 25px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 20px; width: 100%; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); flex-wrap: wrap; gap: 10px; }
.card-header h2 { font-size: 17px; color: var(--dark); display: flex; align-items: center; gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
.form-group { display: flex; flex-direction: column; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--gray); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
.form-group input, .form-group select, .form-group textarea { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; background: #f8fafc; width: 100%; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(30,64,175,0.1); }
.form-group textarea { resize: vertical; min-height: 70px; }
.form-group.full { grid-column: 1 / -1; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(30,64,175,0.4); }
.btn-success { background: linear-gradient(135deg, var(--success), #047857); color: white; }
.btn-danger { background: linear-gradient(135deg, var(--danger), #b91c1c); color: white; }
.btn-warning { background: linear-gradient(135deg, var(--warning), #b45309); color: white; }
.btn-purple { background: linear-gradient(135deg, var(--purple), #6d28d9); color: white; }
.btn-pink { background: linear-gradient(135deg, var(--pink), #be185d); color: white; }
.btn-secondary { background: #e2e8f0; color: var(--dark); }
.btn-info { background: linear-gradient(135deg, var(--secondary), #0e7490); color: white; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 14px 28px; font-size: 15px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.table-container { overflow-x: auto; border-radius: 10px; }
